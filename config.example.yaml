# ============================================================
#  Energy Scout — пример конфигурации.
#  Скопируйте в config.yaml и меняйте под себя.
#  Без config.yaml скрипт работает на значениях по умолчанию.
# ============================================================

city: "Актобе"

# По какому фрагменту названия города искать магазины в API Dina.
# Подходит и русское, и казахское написание.
city_aliases:
  - "акто"
  - "ақтө"
  - "akto"

# Сканировать все магазины города (медленнее) или только один (по умолчанию).
all_shops: false

# Источники. anvar — только промо-листовки (на сайте сети нет цен каталога).
sources:
  dina: true          # полный каталог с ценами и остатками (GraphQL)
  magnum: true        # каталог скидок magnum.kz (SSR-HTML)
  marwin: true        # Marwin/Meloman: импортные Monster, магазин в Keruen City
  anvar: true         # упоминания в промо-листовках, без цен
  web: true           # веб-поиск (DuckDuckGo/Bing) как запасной источник редкостей

# Что ищем. Любое слово из списка (без учёта регистра).
keywords:
  - "энергетическ"
  - "energy drink"
  - "monster"
  - "монстр"
  - "red bull"
  - "ред булл"
  - "burn"
  - "адреналин"
  - "adrenaline"
  - "gorilla"
  - "горилла"
  - "flash"
  - "торнадо"
  - "tornado"
  - "e-on"
  - "dizzy"
  - "lavina"
  - "nitro"

# Мусорные результаты, которые надо отсеять.
exclusions:
  - "корм"
  - "для кошек"
  - "для собак"
  - "игрушк"
  - "сувенир"
  - "шампунь"
  - "гели для душа"
  - "наклейк"
  - "журнал"

# Вежливый режим: пауза между запросами к одному сайту, сек.
delay_seconds: 0.4
timeout_seconds: 25
max_retries: 3

# Веб-поиск: сколько запросов отправлять максимум за один прогон.
web_max_queries: 6
